<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineVerse</title>

    <link rel="stylesheet" href="./main.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="container nav">

            <div class="logo">

                <i class="fa-solid fa-film"></i>

                CineVerse

            </div>

            <ul class="menu">

                <li><a href="#">Home</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">Genres</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Contact</a></li>

            </ul>

            <div class="nav-actions">

                <input type="text" id="searchInput" placeholder="Search movies...">

                <button id="themeBtn">

                    <i class="fa-solid fa-moon"></i>

                </button>

            </div>

        </div>

    </header>

    <!-- HERO -->

    <section class="hero">

        <div class="hero-content container">

            <div class="hero-text">

                <h1>

                    Unlimited Movies,
                    Unlimited Fun

                </h1>

                <p>

                    Watch the latest movies,
                    series and trailers anytime.

                </p>

                <button class="primary-btn">

                    ▶ Watch Now

                </button>

            </div>

        </div>

    </section>

    <!-- MOVIES -->

    <section class="movies">

        <div class="container">

            <h2 class="section-title">

                Trending Movies

            </h2>

            <div class="movie-grid" id="movieGrid">

                <!-- JS inject -->

            </div>

        </div>

    </section>

    <!-- GENRES -->

    <section class="genres">

        <div class="container">

            <h2 class="section-title">

                Popular Genres

            </h2>

            <div class="genre-grid">

                <div class="genre">Action</div>
                <div class="genre">Comedy</div>
                <div class="genre">Drama</div>
                <div class="genre">Horror</div>
                <div class="genre">Sci-Fi</div>
                <div class="genre">Romance</div>

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <footer>

        <div class="container">

            <p>© 2026 CineVerse. All rights reserved.</p>

        </div>

    </footer>

    <script src="./main.js"></script>

</body>

</html>
